name: CI

on:
  push:
    branches: [ "main", "develop", "dev/ci" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: self-hosted
    container:
      image: humber186/ventus:base-latest
      options: >-
        --add-host=host.docker.internal:host-gateway
        --security-opt seccomp=/ci/ventus-env/seccomp-numa.json
      volumes:
        - /ci/ventus-env/ccache:/ccache
        - /ci/ventus-env/artifacts:/artifacts
        - /ci/ventus-env/logs:/logs
    steps:
    - name: Clean workspace before checkout
      run: |
        set -euo pipefail

        workspace="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is not set}"
        echo "Cleaning workspace before checkout: ${workspace}"

        if [ -d "$workspace" ]; then
          find "$workspace" -mindepth 1 -maxdepth 1 -printf 'Removing %p\n'
          find "$workspace" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
        else
          mkdir -p "$workspace"
        fi

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup and Build
      id: build
      uses: ./.github/actions/build-ventus
      with:
        mode: build

    - name: Save CI logs
      if: always()
      run: |
        set -euo pipefail

        workflow_slug="$(printf '%s' "$GITHUB_WORKFLOW" | tr -cs 'A-Za-z0-9._-' '_' | sed 's/^_//;s/_$//')"
        if [ -z "$workflow_slug" ]; then
          workflow_slug="workflow"
        fi

        job_slug="${GITHUB_JOB}"
        dest="/logs/${workflow_slug}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}/${job_slug}"
        mkdir -p "$dest"

        log_sources=()
        if [ -d regression-test-logs ]; then
          log_sources+=(regression-test-logs)
        fi
        if [ "${#log_sources[@]}" -eq 0 ]; then
          echo "No log directories found."
          echo "No log directories found for this run." > "$dest/no-logs.txt"
          log_sources+=("$dest/no-logs.txt")
        fi

        if command -v zstd >/dev/null 2>&1; then
          archive="$dest/ci-logs.tar.zst"
          tar -cf - "${log_sources[@]}" | zstd -T0 -10 --long=27 > "$archive"
        else
          archive="$dest/ci-logs.tar.xz"
          tar -cf - "${log_sources[@]}" | xz -T0 -6e > "$archive"
        fi

        {
          echo "workflow=${GITHUB_WORKFLOW}"
          echo "job=${GITHUB_JOB}"
          echo "run_id=${GITHUB_RUN_ID}"
          echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "repository=${GITHUB_REPOSITORY}"
          echo "sha=${GITHUB_SHA}"
          echo "ref=${GITHUB_REF}"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        } > "$dest/metadata.txt"

        du -h "$archive" || true
        echo "Saved CI logs archive: $archive"
        echo "Saved CI logs metadata: $dest/metadata.txt"

    - name: Cleanup old local regression test logs
      if: always()
      run: |
        if [ -d /logs ]; then
          current_run_glob="/logs/*/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          find /logs -mindepth 3 -maxdepth 3 -type d -mtime +14 ! -path "${current_run_glob}/*" -print -exec rm -rf {} +
          find /logs -mindepth 2 -maxdepth 2 -type d -empty -mtime +14 ! -path "$current_run_glob" -delete
        fi

  test-gvm:
    needs: build
    runs-on: self-hosted
    container:
      image: humber186/ventus:base-latest
      options: >-
        --add-host=host.docker.internal:host-gateway
        --security-opt seccomp=/ci/ventus-env/seccomp-numa.json
      volumes:
        - /ci/ventus-env/ccache:/ccache
        - /ci/ventus-env/artifacts:/artifacts
        - /ci/ventus-env/logs:/logs
    steps:
    - name: Clean workspace before checkout
      run: |
        set -euo pipefail

        workspace="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is not set}"
        echo "Cleaning workspace before checkout: ${workspace}"

        if [ -d "$workspace" ]; then
          find "$workspace" -mindepth 1 -maxdepth 1 -printf 'Removing %p\n'
          find "$workspace" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
        else
          mkdir -p "$workspace"
        fi

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Restore Build
      id: restore_build
      uses: ./.github/actions/build-ventus
      with:
        mode: restore

    - name: Configure RTL/GVM regression parallelism
      id: configure_regression_parallelism
      run: |
        cpu_count="$(nproc)"
        rtl_gvm_worker_threads=8
        reserved_cpus=4
        usable_cpus=$((cpu_count - reserved_cpus))
        if [ "$usable_cpus" -lt "$rtl_gvm_worker_threads" ]; then
          echo "CPU count $cpu_count is too small for one RTL/GVM regression worker group after reserving $reserved_cpus CPUs."
          exit 1
        fi
        rtl_jobs=$((usable_cpus / rtl_gvm_worker_threads * rtl_gvm_worker_threads))
        echo "REGRESSION_TEST_RTL_JOBS=$rtl_jobs" >> "$GITHUB_ENV"
        echo "RTL/GVM regression worker budget: $rtl_jobs (cpu_count=$cpu_count, reserved_cpus=$reserved_cpus, worker_threads_per_job=$rtl_gvm_worker_threads)"

    - name: Run Regression Tests (GVM matrix)
      id: test_gvm_matrix
      run: |
        set -euo pipefail
        . ./env.sh
        VENTUS_SPIKE_LOG=0 python3 regression-test.py --matrix='gvm-no-cache:rtl-no-cache;gvm-with-cache:rtl-with-cache' --progress=ci -j "$REGRESSION_TEST_RTL_JOBS" -t 10 --repeat=5 --allow-checklist-failure
        echo "GVM regression testcase failures are advisory for this job and are reported through GitHub annotations; setup and runner exceptions still fail the step."

    - name: Save CI logs
      if: always()
      run: |
        set -euo pipefail

        workflow_slug="$(printf '%s' "$GITHUB_WORKFLOW" | tr -cs 'A-Za-z0-9._-' '_' | sed 's/^_//;s/_$//')"
        if [ -z "$workflow_slug" ]; then
          workflow_slug="workflow"
        fi

        job_slug="${GITHUB_JOB}"
        dest="/logs/${workflow_slug}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}/${job_slug}"
        mkdir -p "$dest"

        log_sources=()
        if [ -d regression-test-logs ]; then
          log_sources+=(regression-test-logs)
        fi
        if [ -d testcases/_get_case/results ]; then
          log_sources+=(testcases/_get_case/results)
        fi
        if [ "${#log_sources[@]}" -eq 0 ]; then
          echo "No log directories found."
          echo "No log directories found for this run." > "$dest/no-logs.txt"
          log_sources+=("$dest/no-logs.txt")
        fi

        if command -v zstd >/dev/null 2>&1; then
          archive="$dest/ci-logs.tar.zst"
          tar -cf - "${log_sources[@]}" | zstd -T0 -10 --long=27 > "$archive"
        else
          archive="$dest/ci-logs.tar.xz"
          tar -cf - "${log_sources[@]}" | xz -T0 -6e > "$archive"
        fi

        {
          echo "workflow=${GITHUB_WORKFLOW}"
          echo "job=${GITHUB_JOB}"
          echo "run_id=${GITHUB_RUN_ID}"
          echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "repository=${GITHUB_REPOSITORY}"
          echo "sha=${GITHUB_SHA}"
          echo "ref=${GITHUB_REF}"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        } > "$dest/metadata.txt"

        du -h "$archive" || true
        echo "Saved CI logs archive: $archive"
        echo "Saved CI logs metadata: $dest/metadata.txt"

    - name: Cleanup old local regression test logs
      if: always()
      run: |
        if [ -d /logs ]; then
          current_run_glob="/logs/*/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          find /logs -mindepth 3 -maxdepth 3 -type d -mtime +14 ! -path "${current_run_glob}/*" -print -exec rm -rf {} +
          find /logs -mindepth 2 -maxdepth 2 -type d -empty -mtime +14 ! -path "$current_run_glob" -delete
        fi

  test-main:
    needs: build
    runs-on: self-hosted
    container:
      image: humber186/ventus:base-latest
      options: >-
        --add-host=host.docker.internal:host-gateway
        --security-opt seccomp=/ci/ventus-env/seccomp-numa.json
      volumes:
        - /ci/ventus-env/ccache:/ccache
        - /ci/ventus-env/artifacts:/artifacts
        - /ci/ventus-env/logs:/logs
    steps:
    - name: Clean workspace before checkout
      run: |
        set -euo pipefail

        workspace="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is not set}"
        echo "Cleaning workspace before checkout: ${workspace}"

        if [ -d "$workspace" ]; then
          find "$workspace" -mindepth 1 -maxdepth 1 -printf 'Removing %p\n'
          find "$workspace" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
        else
          mkdir -p "$workspace"
        fi

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Restore Build
      id: restore_build
      uses: ./.github/actions/build-ventus
      with:
        mode: restore

    - name: Run Regression Tests (Spike)
      id: test_isa
      continue-on-error: true
      run: |
        . ./env.sh
        VENTUS_SPIKE_LOG=0 VENTUS_BACKEND=isa python3 regression-test.py --repeat=5 --checklist=all -t 2

    - name: Run Regression Tests (Spike extra)
      id: test_spike_extra
      continue-on-error: true
      run: |
        VENTUS_SPIKE_LOG=0 python3 testcases/_get_case/run_ventus_tests.py --cases cases_fast.csv --ref=results_nv --backends spike --rtol 1e-2 --atol 1e-2 --jobs 4 --timeout 7200

    - name: Configure RTL regression parallelism
      id: configure_regression_parallelism
      run: |
        cpu_count="$(nproc)"
        rtl_gvm_worker_threads=8
        reserved_cpus=4
        usable_cpus=$((cpu_count - reserved_cpus))
        if [ "$usable_cpus" -lt "$rtl_gvm_worker_threads" ]; then
          echo "CPU count $cpu_count is too small for one RTL regression worker group after reserving $reserved_cpus CPUs."
          exit 1
        fi
        rtl_jobs=$((usable_cpus / rtl_gvm_worker_threads * rtl_gvm_worker_threads))
        echo "REGRESSION_TEST_RTL_JOBS=$rtl_jobs" >> "$GITHUB_ENV"
        echo "RTL regression worker budget: $rtl_jobs (cpu_count=$cpu_count, reserved_cpus=$reserved_cpus, worker_threads_per_job=$rtl_gvm_worker_threads)"

    - name: Run Regression Tests (Non-GVM matrix)
      id: test_non_gvm_matrix
      continue-on-error: true
      run: |
        . ./env.sh
        VENTUS_SPIKE_LOG=0 python3 regression-test.py --matrix='cycle:cycle;rtl-no-cache:rtl-no-cache;rtl-with-cache:rtl-with-cache' --progress=ci -j "$REGRESSION_TEST_RTL_JOBS" -t 10 --repeat=5

    - name: Check Regression Test Results
      env:
        TEST_SPIKE_EXTRA_OUTCOME: ${{ steps.test_spike_extra.outcome }}
        TEST_ISA_OUTCOME: ${{ steps.test_isa.outcome }}
        CONFIGURE_REGRESSION_PARALLELISM_OUTCOME: ${{ steps.configure_regression_parallelism.outcome }}
        TEST_NON_GVM_MATRIX_OUTCOME: ${{ steps.test_non_gvm_matrix.outcome }}
      run: |
        failed_steps=()

        if [ "$TEST_SPIKE_EXTRA_OUTCOME" != "success" ]; then
          failed_steps+=("Run Regression Tests (Spike extra)")
        fi
        if [ "$TEST_ISA_OUTCOME" != "success" ]; then
          failed_steps+=("Run Regression Tests (ISA)")
        fi
        if [ "$CONFIGURE_REGRESSION_PARALLELISM_OUTCOME" != "success" ]; then
          failed_steps+=("Configure RTL regression parallelism")
        fi
        if [ "$CONFIGURE_REGRESSION_PARALLELISM_OUTCOME" == "success" ] && [ "$TEST_NON_GVM_MATRIX_OUTCOME" != "success" ]; then
          failed_steps+=("Run Regression Tests (Non-GVM matrix)")
        fi

        if [ "${#failed_steps[@]}" -gt 0 ]; then
          printf 'Failed regression test steps:\n'
          printf ' - %s\n' "${failed_steps[@]}"
          exit 1
        fi

    - name: Save CI logs
      if: always()
      run: |
        set -euo pipefail

        workflow_slug="$(printf '%s' "$GITHUB_WORKFLOW" | tr -cs 'A-Za-z0-9._-' '_' | sed 's/^_//;s/_$//')"
        if [ -z "$workflow_slug" ]; then
          workflow_slug="workflow"
        fi

        job_slug="${GITHUB_JOB}"
        dest="/logs/${workflow_slug}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}/${job_slug}"
        mkdir -p "$dest"

        log_sources=()
        if [ -d regression-test-logs ]; then
          log_sources+=(regression-test-logs)
        fi
        if [ -d testcases/_get_case/results ]; then
          log_sources+=(testcases/_get_case/results)
        fi
        if [ "${#log_sources[@]}" -eq 0 ]; then
          echo "No log directories found."
          echo "No log directories found for this run." > "$dest/no-logs.txt"
          log_sources+=("$dest/no-logs.txt")
        fi

        if command -v zstd >/dev/null 2>&1; then
          archive="$dest/ci-logs.tar.zst"
          tar -cf - "${log_sources[@]}" | zstd -T0 -10 --long=27 > "$archive"
        else
          archive="$dest/ci-logs.tar.xz"
          tar -cf - "${log_sources[@]}" | xz -T0 -6e > "$archive"
        fi

        {
          echo "workflow=${GITHUB_WORKFLOW}"
          echo "job=${GITHUB_JOB}"
          echo "run_id=${GITHUB_RUN_ID}"
          echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "repository=${GITHUB_REPOSITORY}"
          echo "sha=${GITHUB_SHA}"
          echo "ref=${GITHUB_REF}"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        } > "$dest/metadata.txt"

        du -h "$archive" || true
        echo "Saved CI logs archive: $archive"
        echo "Saved CI logs metadata: $dest/metadata.txt"

    - name: Cleanup old local regression test logs
      if: always()
      run: |
        if [ -d /logs ]; then
          current_run_glob="/logs/*/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          find /logs -mindepth 3 -maxdepth 3 -type d -mtime +14 ! -path "${current_run_glob}/*" -print -exec rm -rf {} +
          find /logs -mindepth 2 -maxdepth 2 -type d -empty -mtime +14 ! -path "$current_run_glob" -delete
        fi
