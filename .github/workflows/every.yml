name: CI

on:
  push:
    branches: [ "main", "develop", "dev/ci" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: self-hosted
    container:
      image: humber186/ventus:base-latest
      options: --add-host=host.docker.internal:host-gateway
      volumes:
        # Mount host directory for ccache persistence
        # Ensure this directory exists on the host and is writable by the container user (uid 1000)
        - /ci/ventus-env/ccache:/ccache
        - /ci/ventus-env/artifacts:/artifacts
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup and Build
      id: build
      uses: ./.github/actions/build-ventus

    - name: Run Regression Tests (Spike extra)
      if: steps.build.outcome == 'success'
      run: |
        VENTUS_SPIKE_LOG=0 python3 testcases/_get_case/run_ventus_tests.py --cases cases_fast.csv --ref=results_nv --backends spike --rtol 1e-2 --atol 1e-2 --jobs 4 --timeout 7200

    - name: Run Regression Tests (ALL)
      if: steps.build.outcome == 'success'
      run: |
        . ./env.sh
        # RTL simulation is slower, so we might need to increase timeout
        python3 regression-test.py --matrix all -t 10 --repeat=5
