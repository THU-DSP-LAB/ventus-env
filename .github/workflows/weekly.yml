name: Hotspot PR diagnostic

on:
  workflow_dispatch:

jobs:
  hotspot-solo:
    runs-on: self-hosted
    timeout-minutes: 110
    permissions:
      contents: read
    container:
      image: humber186/ventus:base-latest
      options: >-
        --add-host=host.docker.internal:host-gateway
        --security-opt seccomp=/ci/ventus-env/seccomp-numa.json
      volumes:
        - /ci/ventus-env/artifacts:/artifacts:ro
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 5639a4a4061ebfba13aa2705b29c1e58f7f7d505
        submodules: false
        path: hotspot-pr-source

    - name: Restore exact PR build and workload
      shell: bash
      run: |
        set -euo pipefail
        probe_root="${RUNNER_TEMP}/hotspot-solo-${GITHUB_RUN_ID}"
        payload="$probe_root/payload"
        source_root="$GITHUB_WORKSPACE/hotspot-pr-source"
        mkdir -p "$payload"
        echo "HOTSPOT_PROBE_ROOT=$probe_root" >> "$GITHUB_ENV"
        echo "HOTSPOT_PROBE_PAYLOAD=$payload" >> "$GITHUB_ENV"
        echo "HOTSPOT_SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"
        archive_dir=/artifacts/e63b8cef595710721b1193f700f5fa06a9480c46
        test -f "$archive_dir/.ventus-ci-artifact-complete"
        zstd -dc "$archive_dir/install.tar.zst" | tar -xf - -C "$probe_root"
        cp "$archive_dir/.ventus-ci-artifact-complete" "$payload/build-marker.txt"
        git -C "$source_root" submodule update --init --filter=blob:none rodinia
        make -C "$source_root" rodinia_data
        export VENTUS_INSTALL_PREFIX="$probe_root/install"
        source "$source_root/env.sh"
        {
          date -u
          uname -a
          lscpu
          cat /proc/meminfo /proc/loadavg /proc/stat
          for item in cpu.max cpu.stat memory.max memory.events cpuset.cpus.effective; do
            if [ -f "/sys/fs/cgroup/$item" ]; then
              echo "=== cgroup $item ==="
              cat "/sys/fs/cgroup/$item"
            fi
          done
        } > "$payload/resources-before.txt"
        sha256sum "$VENTUS_INSTALL_PREFIX/lib/libVentusRTL-withcache.so" \
          "$VENTUS_INSTALL_PREFIX/lib/libLLVMRISCVCodeGen.so.16git" \
          "$VENTUS_INSTALL_PREFIX/lib/crt0.o" \
          "$source_root/rodinia/data/hotspot3D/power_512x2" \
          "$source_root/rodinia/data/hotspot3D/temp_512x2" > "$payload/input-fingerprints.txt"
        make -C "$source_root/rodinia/opencl/hotspot3D" -j2
        cd "$source_root/rodinia/opencl/hotspot3D"
        export VENTUS_BACKEND=spike VENTUS_SPIKE_LOG=0
        export POCL_CACHE_DIR="$probe_root/pocl-spike"
        timeout 300 ./hotspot3D.out -n 512 -l 2 -i 1 \
          -f ../../data/hotspot3D/power_512x2 ../../data/hotspot3D/temp_512x2 output.txt -p 0 -d 0 \
          > "$payload/spike.log" 2>&1
        cp object0.riscv "$payload/spike-kernel.riscv"
        cp object0.cl "$payload/kernel.cl"
        tail -n 12 "$payload/spike.log"

    - name: Upload prepared input
      uses: actions/upload-artifact@v4
      with:
        name: pr-hotspot-disjoint-input
        path: ${{ env.HOTSPOT_PROBE_PAYLOAD }}
        retention-days: 3

    - name: Run three cached RTL instances on disjoint CPU sets
      shell: bash
      run: |
        set -euo pipefail
        export VENTUS_INSTALL_PREFIX="$HOTSPOT_PROBE_ROOT/install"
        source "$HOTSPOT_SOURCE_ROOT/env.sh"
        export VENTUS_BACKEND=rtlsim-with-cache VENTUS_SPIKE_LOG=0
        python3 - <<'PYPROBE'
        import concurrent.futures
        import json
        import os
        import pathlib
        import shutil
        import subprocess
        import time

        root = pathlib.Path(os.environ["HOTSPOT_PROBE_ROOT"])
        payload = pathlib.Path(os.environ["HOTSPOT_PROBE_PAYLOAD"])
        source = pathlib.Path(os.environ["HOTSPOT_SOURCE_ROOT"]) / "rodinia/opencl/hotspot3D"
        cpus = sorted(os.sched_getaffinity(0))
        assert len(cpus) >= 24, cpus
        seeds = [423000892, 706384697, 440990362]
        def run_one(index):
            seed = seeds[index]
            assigned = cpus[index * 8:(index + 1) * 8]
            work = source.parent / (".hotspot-disjoint-" + str(seed))
            shutil.copytree(source, work)
            env = os.environ.copy()
            env["VENTUS_VERILATOR_SEED"] = str(seed)
            env["POCL_CACHE_DIR"] = str(root / ("pocl-" + str(seed)))
            log = payload / (str(seed) + ".log")
            timing = payload / (str(seed) + "-time.txt")
            command = ["/usr/bin/time", "-v", "-o", str(timing),
                       "numactl", "-m0", "-C", ",".join(map(str, assigned)), "--",
                       "timeout", "--kill-after=10", "6000", "./hotspot3D.out",
                       "-n", "512", "-l", "2", "-i", "1", "-f",
                       "../../data/hotspot3D/power_512x2", "../../data/hotspot3D/temp_512x2",
                       "output.txt", "-p", "0", "-d", "0"]
            start = time.monotonic()
            with log.open("w") as output:
                result = subprocess.run(command, cwd=work, env=env, stdout=output, stderr=subprocess.STDOUT)
            passed = result.returncode == 0 and "CPU reference check:" in log.read_text() and "PASS" in log.read_text()
            elf = work / "object0.riscv"
            if elf.exists():
                shutil.copy2(elf, payload / (str(seed) + ".riscv"))
            return {"seed": seed, "cpus": assigned, "return_code": result.returncode,
                    "reference_pass": passed, "wall_seconds": time.monotonic() - start}
        with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
            futures = [pool.submit(run_one, index) for index in range(3)]
            results = []
            for future in concurrent.futures.as_completed(futures):
                results.append(future.result())
                (payload / "disjoint-results.json").write_text(json.dumps(results, indent=2) + "\n")
                print(json.dumps(results[-1]), flush=True)
        raise SystemExit(0 if all(item["reference_pass"] for item in results) else 1)
        PYPROBE

    - name: Upload disjoint result
      if: always() && env.HOTSPOT_PROBE_PAYLOAD != ''
      uses: actions/upload-artifact@v4
      with:
        name: pr-hotspot-disjoint-result
        path: ${{ env.HOTSPOT_PROBE_PAYLOAD }}
        retention-days: 3
