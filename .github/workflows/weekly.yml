name: Hotspot PR diagnostic

on:
  workflow_dispatch:

jobs:
  hotspot-solo:
    runs-on: self-hosted
    timeout-minutes: 45
    permissions:
      contents: read
    container:
      image: humber186/ventus:base-latest
      options: >-
        --add-host=host.docker.internal:host-gateway
        --security-opt seccomp=/ci/ventus-env/seccomp-numa.json
      volumes:
        - /ci/ventus-env/artifacts:/artifacts:ro
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 5639a4a4061ebfba13aa2705b29c1e58f7f7d505
        submodules: false
        path: hotspot-pr-source

    - name: Restore exact PR build and workload
      shell: bash
      run: |
        set -euo pipefail
        probe_root="${RUNNER_TEMP}/hotspot-solo-${GITHUB_RUN_ID}"
        payload="$probe_root/payload"
        source_root="$GITHUB_WORKSPACE/hotspot-pr-source"
        mkdir -p "$payload"
        echo "HOTSPOT_PROBE_ROOT=$probe_root" >> "$GITHUB_ENV"
        echo "HOTSPOT_PROBE_PAYLOAD=$payload" >> "$GITHUB_ENV"
        echo "HOTSPOT_SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"
        archive_dir=/artifacts/e63b8cef595710721b1193f700f5fa06a9480c46
        test -f "$archive_dir/.ventus-ci-artifact-complete"
        zstd -dc "$archive_dir/install.tar.zst" | tar -xf - -C "$probe_root"
        cp "$archive_dir/.ventus-ci-artifact-complete" "$payload/build-marker.txt"
        git -C "$source_root" submodule update --init --filter=blob:none rodinia
        make -C "$source_root" rodinia_data
        export VENTUS_INSTALL_PREFIX="$probe_root/install"
        source "$source_root/env.sh"
        {
          date -u
          uname -a
          lscpu
          cat /proc/meminfo /proc/loadavg /proc/stat
          for item in cpu.max cpu.stat memory.max memory.events cpuset.cpus.effective; do
            if [ -f "/sys/fs/cgroup/$item" ]; then
              echo "=== cgroup $item ==="
              cat "/sys/fs/cgroup/$item"
            fi
          done
        } > "$payload/resources-before.txt"
        sha256sum "$VENTUS_INSTALL_PREFIX/lib/libVentusRTL-withcache.so" \
          "$VENTUS_INSTALL_PREFIX/lib/libLLVMRISCVCodeGen.so.16git" \
          "$VENTUS_INSTALL_PREFIX/lib/crt0.o" \
          "$source_root/rodinia/data/hotspot3D/power_512x2" \
          "$source_root/rodinia/data/hotspot3D/temp_512x2" > "$payload/input-fingerprints.txt"
        make -C "$source_root/rodinia/opencl/hotspot3D" -j2
        cd "$source_root/rodinia/opencl/hotspot3D"
        export VENTUS_BACKEND=spike VENTUS_SPIKE_LOG=0
        export POCL_CACHE_DIR="$probe_root/pocl-spike"
        timeout 300 ./hotspot3D.out -n 512 -l 2 -i 1 \
          -f ../../data/hotspot3D/power_512x2 ../../data/hotspot3D/temp_512x2 output.txt -p 0 -d 0 \
          > "$payload/spike.log" 2>&1
        cp object0.riscv "$payload/spike-kernel.riscv"
        cp object0.cl "$payload/kernel.cl"
        tail -n 12 "$payload/spike.log"

    - name: Upload prepared input
      uses: actions/upload-artifact@v4
      with:
        name: pr-hotspot-solo-input
        path: ${{ env.HOTSPOT_PROBE_PAYLOAD }}
        retention-days: 3

    - name: Run one cached RTL instance with the original failed seed
      shell: bash
      run: |
        set -euo pipefail
        export VENTUS_INSTALL_PREFIX="$HOTSPOT_PROBE_ROOT/install"
        source "$HOTSPOT_SOURCE_ROOT/env.sh"
        export VENTUS_BACKEND=rtlsim-with-cache VENTUS_SPIKE_LOG=0
        export VENTUS_VERILATOR_SEED=423000892
        export POCL_CACHE_DIR="$HOTSPOT_PROBE_ROOT/pocl-rtl"
        cd "$HOTSPOT_SOURCE_ROOT/rodinia/opencl/hotspot3D"
        cpus=$(awk '/Cpus_allowed_list:/ {print $2}' /proc/self/status)
        /usr/bin/time -v -o "$HOTSPOT_PROBE_PAYLOAD/time.txt" \
          numactl -m0 -C "$cpus" -- timeout --kill-after=10 1800 \
          ./hotspot3D.out -n 512 -l 2 -i 1 \
          -f ../../data/hotspot3D/power_512x2 ../../data/hotspot3D/temp_512x2 output.txt -p 0 -d 0 \
          > "$HOTSPOT_PROBE_PAYLOAD/rtl.log" 2>&1 &
        probe_pid=$!
        while kill -0 "$probe_pid" 2>/dev/null; do
          {
            date -u
            cat /proc/loadavg /proc/stat
            for item in /proc/pressure/cpu /proc/pressure/memory /sys/fs/cgroup/cpu.stat; do
              if [ -f "$item" ]; then echo "=== $item ==="; cat "$item"; fi
            done
            targets="$probe_pid"
            parents="$probe_pid"
            for depth in 1 2; do
              children=""
              for pid in $parents; do
                if [ -r "/proc/$pid/task/$pid/children" ]; then
                  children="$children $(cat "/proc/$pid/task/$pid/children")"
                fi
              done
              targets="$targets $children"
              parents="$children"
            done
            list=$(echo "$targets" | xargs | tr ' ' ',')
            ps -o pid,ppid,psr,pcpu,pmem,stat,time -p "$list" || true
          } >> "$HOTSPOT_PROBE_PAYLOAD/progress.txt"
          sleep 60
        done
        set +e
        wait "$probe_pid"
        probe_rc=$?
        set -e
        if [ -f object0.riscv ]; then cp object0.riscv "$HOTSPOT_PROBE_PAYLOAD/rtl-kernel.riscv"; fi
        tail -n 100 "$HOTSPOT_PROBE_PAYLOAD/rtl.log"
        cat "$HOTSPOT_PROBE_PAYLOAD/time.txt"
        if [ "$probe_rc" -eq 0 ]; then
          if ! grep -q 'CPU reference check:.*PASS' "$HOTSPOT_PROBE_PAYLOAD/rtl.log"; then probe_rc=1; fi
        fi
        echo "$probe_rc" > "$HOTSPOT_PROBE_PAYLOAD/exit-code.txt"
        exit "$probe_rc"

    - name: Upload solo result
      if: always() && env.HOTSPOT_PROBE_PAYLOAD != ''
      uses: actions/upload-artifact@v4
      with:
        name: pr-hotspot-solo-result
        path: ${{ env.HOTSPOT_PROBE_PAYLOAD }}
        retention-days: 3
